name: Auto Generate Posts

on:
  schedule:
    # Sunday 02:00 UTC — generate 3 drafts for the week starting next Monday 00:00 UTC
    - cron: '0 2 * * 0'

  workflow_dispatch:
    inputs:
      bulk:
        description: 'Generate 12 months of historical posts?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: auto-generate
  cancel-in-progress: true

jobs:
  generate:
    name: Generate baking content
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run weekly generation
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.bulk != 'true')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAUDE_API_KEY:   ${{ secrets.CLAUDE_API_KEY }}
          TAVILY_API_KEY:   ${{ secrets.TAVILY_API_KEY }}
          BEIAI_API_URL:    ${{ secrets.BEIAI_API_URL }}
          CRON_SECRET:      ${{ secrets.CRON_SECRET }}
          AUTO_GENERATE_REPORT: ${{ runner.temp }}/beiai-source-report.json
        run: |
          node scripts/auto-generate.js

      - name: Run bulk historical generation
        if: github.event_name == 'workflow_dispatch' && inputs.bulk == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAUDE_API_KEY:   ${{ secrets.CLAUDE_API_KEY }}
          TAVILY_API_KEY:   ${{ secrets.TAVILY_API_KEY }}
          BEIAI_API_URL:    ${{ secrets.BEIAI_API_URL }}
          CRON_SECRET:      ${{ secrets.CRON_SECRET }}
          AUTO_GENERATE_REPORT: ${{ runner.temp }}/beiai-source-report.json
        run: |
          node scripts/auto-generate.js --bulk

      - name: Save source and delivery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beiai-generation-report-${{ github.run_id }}
          path: ${{ runner.temp }}/beiai-source-report.json
          if-no-files-found: warn
          retention-days: 30
